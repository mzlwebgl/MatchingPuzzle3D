<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="元美互动(YuanMeiInteractive)">
  <title>3DMatchingPuzzle</title>
  <link rel="icon" href="favicon.ico">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: url("logo.jpg") center center / cover no-repeat;
      background-color: #000;
    }

    #unity-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;

      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    #unity-canvas {
      display: none;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
    }

    #loading {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.50);

      color: #fff;
      text-align: center;
    }

    #progress {
      width: 60%;
      max-width: 360px;
      height: 20px;

      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.15);
    }

    #fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #3aaaff, #77ddff);
      transition: width 0.2s ease-out;
    }

    #percent {
      margin-top: 12px;
      font-size: 16px;
      color: #fff;
      text-shadow: 0 0 6px rgba(0, 0, 0, .8);
    }

    #error-msg {
      display: none;
      font-size: 14px;
      color: #ffaaaa;
      margin-top: 20px;
      text-shadow: 0 0 5px #000;
    }

    @media (max-width: 768px) {
      #progress {
        width: 80%;
        height: 14px;
      }

      #percent {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <div id="loading">
      <div id="progress">
        <div id="fill"></div>
      </div>
      <div id="percent">0%</div>
    </div>

    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>
  <script type="module">
    import SystemHelper from './SystemHelper.js';

    window.IsMobileDevice = function IsMobileDevice(value) {
      try {
        let bMobileDevice = String(SystemHelper.IsMobileDevice());
        window.UnityInstance.SendMessage('UnityWebGL_JavaScript', 'IsMobileDevice', bMobileDevice);
      } catch (e) {
        alert(`获取设备类型异常: ${e}`);
      }
    }
  </script>
  <script src="Build/cee3bfd5589651a8b16e2a12b8abe5b3.loader.js"></script>
  <script>
    window.UnityInstance = null;
    function EnterFullscreen(number) {
      try {
        window.UnityInstance.SetFullscreen(parseInt(number, 10));
      } catch (e) {
        alert(`进入全屏异常: ${e}`);
      }
    }
    function ExitFullscreen(number) {
      try {
        window.UnityInstance.SetFullscreen(parseInt(number, 10));
      } catch (e) {
        alert(`退出全屏异常: ${e}`);
      }
    }

    const canvas = document.querySelector("#unity-canvas");

    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/6366cc0b2d32087ab90bd92bd1f4c092.data.unityweb",
      frameworkUrl: "Build/7b40a6787a637f6a935ba45af09fb87a.framework.js.unityweb",
      codeUrl: "Build/f5dd4474440cb708d4708da47e92bbc0.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "YuanMeiInteractive",
      productName: "3DMatchingPuzzle",
      productVersion: "0.1",
      // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
      // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
    }, (progress) => {
      const fill = document.getElementById("fill");
      const percent = document.getElementById("percent");
      fill.style.width = (progress * 100) + "%";
      percent.textContent = Math.round(progress * 100) + "%";
    }).then((unityInstance) => {
      window.UnityInstance = unityInstance;

      document.getElementById("loading").style.display = "none";
      canvas.style.display = "block";
    }).catch((err) => {
      document.getElementById("percent").textContent = "加载失败";
      console.error(err);
    });
  </script>
</body>

</html>
